name: Build aptinnocence HDR10 addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply HDR10 swapchain-encoding patch
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          d = pathlib.Path('src/games/aptinnocence')

          # 1) shared.h - new injected float (keeps struct at 32 floats)
          p = d / 'shared.h'
          s = p.read_bytes()
          old = b'  float toneMapShoulderStart;'
          assert old in s, 'shared.h anchor missing'
          p.write_bytes(s.replace(old, old + b'\r\n  float toneMapHDR10;', 1))
          print('patched shared.h')

          # 2) common.hlsl - branch the final encode in FinalizeOutput()
          p = d / 'common.hlsl'
          s = p.read_bytes()
          old = b'  color /= 80.f;\r\n  return color;'
          assert old in s, 'common.hlsl anchor missing'
          new = (b'  if (injectedData.toneMapHDR10 != 0.f) {\r\n'
                 b'    // HDR10: PQ ST.2084, BT.2020 primaries, 1.0 == 10000 nits\r\n'
                 b'    color = renodx::color::bt2020::from::BT709(color);\r\n'
                 b'    color = renodx::color::pq::EncodeSafe(color, 1.f);\r\n'
                 b'  } else {\r\n'
                 b'    // scRGB: linear BT.709, 1.0 == 80 nits\r\n'
                 b'    color /= 80.f;\r\n'
                 b'  }\r\n'
                 b'  return color;')
          p.write_bytes(s.replace(old, new, 1))
          print('patched common.hlsl')

          # 3) addon.cpp - the setting, read before the swapchain is created
          p = d / 'addon.cpp'
          s = p.read_text()
          anchor = '      renodx::utils::random::binds.push_back(&shader_injection.random);\n'
          assert anchor in s, 'addon.cpp anchor missing'
          block = '\n'.join([
              '',
              '      {',
              '        auto* setting = new renodx::utils::settings::Setting{',
              '            .key = "toneMapHDR10",',
              '            .value_type = renodx::utils::settings::SettingValueType::INTEGER,',
              '            .default_value = 0.f,',
              '            .can_reset = false,',
              '            .label = "Swapchain Encoding",',
              '            .section = "Display Output",',
              '            .tooltip =',
              '                "Sets how the final image is encoded for the display. "',
              '                "scRGB is FP16 linear BT.709 (default, best precision). "',
              '                "HDR10 is 10-bit PQ ST.2084 in BT.2020, for displays or "',
              '                "capture setups that mishandle scRGB. "',
              '                "Requires a game restart to take effect.",',
              '            .labels = {"scRGB (FP16)", "HDR10 (PQ)"},',
              '            .is_global = true,',
              '        };',
              '        renodx::utils::settings::LoadSetting(renodx::utils::settings::global_name, setting);',
              '        const bool use_hdr10 = (setting->GetValue() == 1.f);',
              '        renodx::mods::swapchain::SetUseHDR10(use_hdr10);',
              '        shader_injection.toneMapHDR10 = use_hdr10 ? 1.f : 0.f;',
              '        settings.push_back(setting);',
              '      }',
              '',
          ])
          p.write_text(s.replace(anchor, anchor + block, 1))
          print('patched addon.cpp')
          PY
          git --no-pager diff --stat

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset vs-x64

      - name: Build aptinnocence only
        run: cmake --build --preset vs-x64-release --target aptinnocence --verbose

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-aptinnocence-hdr10
          path: "**/renodx-aptinnocence.addon64"
          if-no-files-found: error
